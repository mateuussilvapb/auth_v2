<div class="console-page">
  <h1>{{ isEditing ? 'Editar usuário' : 'Novo usuário' }}</h1>

  @if (loading()) {
    <p>Carregando...</p>
  } @else {
    <form (ngSubmit)="submit()" #userForm="ngForm">
      @if (!isEditing) {
        <label for="username">Usuário</label>
        <input id="username" name="username" type="text" [(ngModel)]="username" required />
      }

      <label for="name">Nome</label>
      <input id="name" name="name" type="text" [(ngModel)]="name" required />

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" required />

      @if (!isEditing) {
        <label for="password">Senha inicial</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" required minlength="8" />
      }

      @if (errorMessage()) {
        <p class="error" role="alert">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="userForm.invalid || submitting()">
        {{ submitting() ? 'Salvando...' : 'Salvar' }}
      </button>
      <a [routerLink]="['/console/tenants', tenantId, 'users']">Cancelar</a>
    </form>
  }
</div>
