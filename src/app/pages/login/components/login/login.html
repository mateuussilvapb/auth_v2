<div class="login-page">
  <div class="login-card">
    @if (branding(); as brand) {
      <div class="branding">
        @if (brand.logoUrl) {
          <img [src]="brand.logoUrl" [alt]="brand.tenantName" class="logo" />
        }
        <h1>{{ brand.tenantName }}</h1>
      </div>
    } @else {
      <h1>Entrar</h1>
    }

    @if (clientId) {
      <form (ngSubmit)="submit()" #loginForm="ngForm">
        <label for="usernameOrEmail">Usuário ou e-mail</label>
        <input
          id="usernameOrEmail"
          name="usernameOrEmail"
          type="text"
          [(ngModel)]="usernameOrEmail"
          required
          autocomplete="username"
        />

        <label for="password">Senha</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
        />

        @if (errorMessage()) {
          <p class="error" role="alert">{{ errorMessage() }}</p>
        }

        <button type="submit" [disabled]="loginForm.invalid || submitting()">
          {{ submitting() ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>

      <a [routerLink]="['/esqueci-senha']" [queryParams]="{ client_id: clientId }">Esqueci minha senha</a>
    } @else {
      <p class="error" role="alert">{{ errorMessage() }}</p>
    }
  </div>
</div>
