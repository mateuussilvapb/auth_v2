<h1 class="text-display mb-4">Redefinir senha</h1>

@if (invalidLink()) {
  <p class="error-color" role="alert">Link de redefinição inválido. Solicite um novo.</p>
} @else if (success()) {
  <p class="text-body mb-3">Senha redefinida com sucesso.</p>
  <a [routerLink]="['/login']" class="text-small">Voltar para o login</a>
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()">
    <app-form-label
      for="newPassword"
      label="Nova senha"
      [control]="form.controls.newPassword"
      [errorMessages]="errorMessages"
    >
      <p-password
        inputId="newPassword"
        formControlName="newPassword"
        [toggleMask]="true"
        autocomplete="new-password"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
    </app-form-label>

    @if (errorMessage()) {
      <p class="error-color text-small mt-3" role="alert">{{ errorMessage() }}</p>
    }

    <p-button
      type="submit"
      label="Salvar"
      styleClass="w-full mt-4"
      [loading]="submitting()"
      [disabled]="form.invalid"
    />
  </form>
}
