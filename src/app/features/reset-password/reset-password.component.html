<div class="login-page">
  <div class="login-card">
    <h1>Redefinir senha</h1>

    @if (invalidLink()) {
      <p class="error" role="alert">Link de redefinição inválido. Solicite um novo.</p>
    } @else if (success()) {
      <p>Senha redefinida com sucesso.</p>
      <a [routerLink]="['/login']">Voltar para o login</a>
    } @else {
      <form (ngSubmit)="submit()" #resetForm="ngForm">
        <label for="newPassword">Nova senha</label>
        <input
          id="newPassword"
          name="newPassword"
          type="password"
          [(ngModel)]="newPassword"
          required
          minlength="8"
          autocomplete="new-password"
        />

        @if (errorMessage()) {
          <p class="error" role="alert">{{ errorMessage() }}</p>
        }

        <button type="submit" [disabled]="resetForm.invalid || submitting()">
          {{ submitting() ? 'Salvando...' : 'Salvar' }}
        </button>
      </form>
    }
  </div>
</div>
