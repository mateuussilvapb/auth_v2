# ==========================================
# OVERRIDES DE DESENVOLVIMENTO (sobrescreve application.yml)
# ==========================================
# Apenas defaults não-sensíveis (host/porta locais). Usuário/senha continuam
# vindo de variáveis de ambiente — ver docker-compose.yml e README.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authserver}

  jpa:
    show-sql: true
    properties:
      hibernate:
        use_sql_comments: true

  flyway:
    validate-on-migrate: true

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.mssousa.authserver: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
