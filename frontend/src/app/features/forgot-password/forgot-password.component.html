<div class="login-page">
  <div class="login-card">
    <h1>Esqueci minha senha</h1>

    @if (submitted()) {
      <p>Se o usuário existir, um e-mail com instruções de redefinição foi enviado.</p>
    } @else {
      <form (ngSubmit)="submit()" #forgotForm="ngForm">
        <label for="usernameOrEmail">Usuário ou e-mail</label>
        <input
          id="usernameOrEmail"
          name="usernameOrEmail"
          type="text"
          [(ngModel)]="usernameOrEmail"
          required
          autocomplete="username"
        />

        <button type="submit" [disabled]="forgotForm.invalid || submitting()">
          {{ submitting() ? 'Enviando...' : 'Enviar' }}
        </button>
      </form>
    }

    <a [routerLink]="['/login']" [queryParams]="{ client_id: clientId }">Voltar para o login</a>
  </div>
</div>
