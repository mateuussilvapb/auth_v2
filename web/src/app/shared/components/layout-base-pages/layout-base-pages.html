<div class="flex md:flex-row flex-column md:justify-content-between md:align-items-center gap-2">
  <div class="flex flex-column">
    <h1 class="text-h1 m-0">{{ title() }}</h1>
    @if (subtitle()) {
      <small class="text-small text-color-secondary">{{ subtitle() }}</small>
    }
  </div>
  @if (buttonActionLabel()) {
    <p-button [label]="buttonActionLabel()" severity="primary" (onClick)="onButtonActionClick()" />
  }
</div>

<div class="mt-3">
  <ng-content></ng-content>
</div>
