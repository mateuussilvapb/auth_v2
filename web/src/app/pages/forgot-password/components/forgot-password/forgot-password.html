<h1 class="text-display mb-4">Esqueci minha senha</h1>

@if (submitted()) {
  <p class="text-body">Se o e-mail estiver cadastrado, enviaremos as instruções.</p>
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()">
    <app-form-label for="usernameOrEmail" label="Usuário ou e-mail" [control]="form.controls.usernameOrEmail">
      <input
        pInputText
        id="usernameOrEmail"
        formControlName="usernameOrEmail"
        autocomplete="username"
        class="w-full"
      />
    </app-form-label>

    <p-button
      type="submit"
      label="Enviar"
      styleClass="w-full mt-4"
      [loading]="submitting()"
      [disabled]="form.invalid"
    />
  </form>
}

<div class="text-center mt-3">
  <a [routerLink]="['/login']" [queryParams]="{ client_id: clientId }" class="text-small">Voltar para o login</a>
</div>
