<div class="flex flex-column gap-4" style="max-width: 480px">
  <h1 class="text-h1 m-0">Novo platform admin</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-column gap-3">
    <app-form-label #usernameLabel="appFormLabel" for="username" label="Usuário" [control]="form.controls['username']">
      <input
        id="username"
        type="text"
        pInputText
        formControlName="username"
        class="w-full"
        [attr.aria-describedby]="usernameLabel.errorMessage() ? 'username-error' : null"
        [attr.aria-invalid]="usernameLabel.errorMessage() ? true : null"
      />
    </app-form-label>

    <app-form-label #nameLabel="appFormLabel" for="name" label="Nome" [control]="form.controls['name']">
      <input
        id="name"
        type="text"
        pInputText
        formControlName="name"
        class="w-full"
        [attr.aria-describedby]="nameLabel.errorMessage() ? 'name-error' : null"
        [attr.aria-invalid]="nameLabel.errorMessage() ? true : null"
      />
    </app-form-label>

    <app-form-label #emailLabel="appFormLabel" for="email" label="E-mail" [control]="form.controls['email']">
      <input
        id="email"
        type="email"
        pInputText
        formControlName="email"
        class="w-full"
        [attr.aria-describedby]="emailLabel.errorMessage() ? 'email-error' : null"
        [attr.aria-invalid]="emailLabel.errorMessage() ? true : null"
      />
    </app-form-label>

    <app-form-label for="password" label="Senha inicial" [control]="form.controls['password']">
      <p-password
        inputId="password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
    </app-form-label>

    <div class="flex gap-2 mt-2">
      <p-button
        type="submit"
        label="Salvar"
        severity="primary"
        [disabled]="form.invalid || submitting()"
        [loading]="submitting()"
      />
      <p-button type="button" label="Cancelar" severity="secondary" [outlined]="true" (onClick)="cancel()" />
    </div>
  </form>
</div>
