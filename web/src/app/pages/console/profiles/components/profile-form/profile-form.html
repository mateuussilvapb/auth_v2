<div class="flex flex-column gap-4" style="max-width: 480px">
  <h1 class="text-h1 m-0">{{ isEditMode() ? 'Editar perfil' : 'Novo perfil' }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-column gap-3">
    <app-form-label for="code" label="Código" [control]="form.controls['code']">
      <input id="code" type="text" pInputText formControlName="code" class="w-full font-mono" />
    </app-form-label>

    <app-form-label for="description" label="Descrição" [control]="form.controls['description']">
      <input id="description" type="text" pInputText formControlName="description" class="w-full" />
    </app-form-label>

    <div class="flex gap-2 mt-2">
      <p-button
        type="submit"
        label="Salvar"
        severity="primary"
        [disabled]="form.invalid || submitting()"
        [loading]="submitting()"
      />
      <p-button type="button" label="Cancelar" severity="secondary" [outlined]="true" (onClick)="cancel()" />
    </div>
  </form>
</div>
