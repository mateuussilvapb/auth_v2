<app-layout-base-pages title="Perfis" buttonActionLabel="Novo perfil" (actionButtonClick)="goToCreate()">
  @if (errorMessage()) {
    <div class="flex flex-column align-items-start gap-3 p-4 border-1 surface-border border-round">
      <span class="text-body" role="alert">{{ errorMessage() }}</span>
      <p-button label="Tentar novamente" severity="secondary" (onClick)="load()" />
    </div>
  } @else {
    <p-table [value]="profiles()" [loading]="loading()" dataKey="id">
      <ng-template #header>
        <tr>
          <th scope="col">Código</th>
          <th scope="col">Descrição</th>
          <th scope="col">Status</th>
          <th scope="col"></th>
        </tr>
      </ng-template>
      <ng-template #body let-profile>
        <tr>
          <td class="font-mono">{{ profile.code }}</td>
          <td>{{ profile.description || '—' }}</td>
          <td><app-status-tag [status]="profile.status" /></td>
          <td>
            <div class="flex gap-2 justify-content-end flex-wrap">
              <p-button label="Editar" size="small" [text]="true" (onClick)="goToEdit(profile)" />
              <p-button
                [label]="profile.status === 'ACTIVE' ? 'Desativar' : 'Ativar'"
                size="small"
                [text]="true"
                [severity]="profile.status === 'ACTIVE' ? 'danger' : 'secondary'"
                (onClick)="toggleStatus(profile)"
              />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #loadingbody>
        @for (row of skeletonRows; track row) {
          <tr>
            <td><p-skeleton width="6rem" /></td>
            <td><p-skeleton width="10rem" /></td>
            <td><p-skeleton width="5rem" /></td>
            <td><p-skeleton width="8rem" /></td>
          </tr>
        }
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4">
            <div class="flex flex-column align-items-center gap-3 py-5">
              <span class="text-body text-color-secondary">Nenhum perfil cadastrado para este sistema.</span>
              <p-button label="Criar o primeiro" severity="primary" (onClick)="goToCreate()" />
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  }
</app-layout-base-pages>
