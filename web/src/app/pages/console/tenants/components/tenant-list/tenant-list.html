<app-layout-base-pages title="Tenants" buttonActionLabel="Novo tenant" (actionButtonClick)="goToCreate()">
  @if (errorMessage()) {
    <div class="flex flex-column align-items-start gap-3 p-4 border-1 surface-border border-round">
      <span class="text-body" role="alert">{{ errorMessage() }}</span>
      <p-button label="Tentar novamente" severity="secondary" (onClick)="load(page())" />
    </div>
  } @else {
    <p-table
      [value]="tenants()"
      [lazy]="true"
      [paginator]="true"
      [rows]="pageSize"
      [totalRecords]="totalRecords()"
      [loading]="loading()"
      (onPage)="onPage($event)"
      dataKey="id"
    >
      <ng-template #header>
        <tr>
          <th scope="col">Código</th>
          <th scope="col">Nome</th>
          <th scope="col">Status</th>
          <th scope="col"></th>
        </tr>
      </ng-template>
      <ng-template #body let-tenant>
        <tr>
          <td class="font-mono">{{ tenant.code }}</td>
          <td>{{ tenant.name }}</td>
          <td><app-status-tag [status]="tenant.status" /></td>
          <td>
            <div class="flex gap-2 justify-content-end flex-wrap">
              <p-button label="Editar" size="small" [text]="true" (onClick)="goToEdit(tenant)" />
              <p-button label="Sistemas" size="small" [text]="true" (onClick)="goToSystems(tenant)" />
              <p-button label="Usuários" size="small" [text]="true" (onClick)="goToUsers(tenant)" />
              <p-button
                [label]="tenant.status === 'ACTIVE' ? 'Desativar' : 'Ativar'"
                size="small"
                [text]="true"
                [severity]="tenant.status === 'ACTIVE' ? 'danger' : 'secondary'"
                (onClick)="toggleStatus(tenant)"
              />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #loadingbody>
        @for (row of skeletonRows; track row) {
          <tr>
            <td><p-skeleton width="6rem" /></td>
            <td><p-skeleton width="10rem" /></td>
            <td><p-skeleton width="5rem" /></td>
            <td><p-skeleton width="10rem" /></td>
          </tr>
        }
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4">
            <div class="flex flex-column align-items-center gap-3 py-5">
              <span class="text-body text-color-secondary">Nenhum tenant cadastrado.</span>
              <p-button label="Criar o primeiro" severity="primary" (onClick)="goToCreate()" />
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  }
</app-layout-base-pages>
