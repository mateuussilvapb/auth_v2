<div class="flex flex-column gap-4" style="max-width: 480px">
  <h1 class="text-h1 m-0">{{ isEditMode() ? 'Editar tenant' : 'Novo tenant' }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-column gap-3">
    <app-form-label for="code" label="Código" [control]="form.controls['code']">
      <input id="code" type="text" pInputText formControlName="code" class="w-full" />
    </app-form-label>

    <app-form-label for="name" label="Nome" [control]="form.controls['name']">
      <input id="name" type="text" pInputText formControlName="name" class="w-full" />
    </app-form-label>

    <div class="flex gap-2 mt-2">
      <p-button
        type="submit"
        label="Salvar"
        severity="primary"
        [disabled]="form.invalid || submitting()"
        [loading]="submitting()"
      />
      <p-button type="button" label="Cancelar" severity="secondary" [outlined]="true" (onClick)="cancel()" />
    </div>
  </form>
</div>
