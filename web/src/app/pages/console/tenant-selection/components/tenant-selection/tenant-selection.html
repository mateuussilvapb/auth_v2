<app-layout-base-pages
  title="Selecionar tenant"
  subtitle="Escolha o tenant em que deseja trabalhar. Pode ser trocado a qualquer momento pelo cabeçalho."
  buttonActionLabel="Novo tenant"
  (actionButtonClick)="router.navigate(['/console/tenants/novo'])"
>
  <p-table
    [value]="tenants()"
    [lazy]="true"
    [paginator]="true"
    [rows]="pageSize"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    (onPage)="onPage($event)"
    dataKey="id"
  >
    <ng-template #header>
      <tr>
        <th scope="col">Código</th>
        <th scope="col">Nome</th>
        <th scope="col">Status</th>
        <th scope="col"></th>
      </tr>
    </ng-template>
    <ng-template #body let-tenant>
      <tr>
        <td class="font-mono">{{ tenant.code }}</td>
        <td>{{ tenant.name }}</td>
        <td><app-status-tag [status]="tenant.status" /></td>
        <td>
          <p-button label="Selecionar" size="small" (onClick)="select(tenant)" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="4">Nenhum tenant encontrado.</td>
      </tr>
    </ng-template>
  </p-table>
</app-layout-base-pages>
