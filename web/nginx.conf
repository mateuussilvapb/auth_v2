# Nginx serve o build de produção do Angular e o backend na mesma origem (seção 11 do
# plano) — é o próprio nginx que resolve o problema estrutural de dev descrito em
# PROGRESS.md (SpaLoginAuthenticationEntryPoint/consentPage usam caminho relativo,
# assumindo mesma origem). Reaproveitado pela imagem Docker da Fase 11
# (docker-compose.prod.yml) — "auth-server" é o nome do serviço Compose do backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Endpoints do Authorization Server (/oauth2/authorize, /oauth2/token, JWKS, etc.) e
    # descoberta OIDC (/.well-known/openid-configuration) — consumidos tanto pelos
    # sistemas satélite quanto pelo cliente PKCE do console (angular-oauth2-oidc).
    location /oauth2/ {
        proxy_pass http://auth-server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/ {
        proxy_pass http://auth-server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API pública de autenticação/consentimento (seção 2.2/7) — sessão via cookie
    # HttpOnly, precisa da mesma origem para SameSite=Lax funcionar sem CORS.
    location /api/auth/ {
        proxy_pass http://auth-server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API administrativa (seção 9) — bearer token, console Angular consome via mesma
    # origem também.
    location /admin/api/ {
        proxy_pass http://auth-server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentação OpenAPI/Swagger (Fase 8), mesma origem/autenticação do que documenta.
    location ~ ^/(v3/api-docs|swagger-ui) {
        proxy_pass http://auth-server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tudo o que não é backend é uma rota do Angular Router (SPA com HTML5 history mode)
    # — sem isso, um refresh em /console/tenants (deep link) cairia como 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
